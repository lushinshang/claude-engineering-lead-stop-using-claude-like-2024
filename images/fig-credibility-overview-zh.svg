<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 727" width="1440" height="727" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">訪談說法可信度分類</title><desc id="d">四欄分類。已確認：Claude Tag、新版 Projects、Cowork 內建瀏覽器、Cowork 與 chat 合併、〈Building effective agents〉建議先求最簡單、Cowork 衝刺一週半（建立在約一年半的內部原型上）。當事方自揭：輸送帶時期、裁判內部流程、三步驟濃縮原則、不會用 Blender 卻用 3D 素材重做網站。單方說法：官方建議對 skill 要非常小心、Opus 5.5 動態影片 3D 大躍進、在要求每個數字附一手來源的前提下，他自己對單一 agent 的事實查核百分之百完全信任；審查通常可以用低一階的模型，看任務而定；目前的經濟價值大概大部分來自自動化。可疑：數學奧賽銀牌到金牌「四、五個月」（實際約一年）、「NASA 正在確認」新行星（實為候選）。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="1440" height="727" fill="#f9f7f4"/><rect id="b106" x="30.0" y="30.0" width="330.0" height="627.4" fill="#dff1e8" stroke="#2e8b6a" stroke-width="1.5" rx="12"/><rect x="30.0" y="30.0" width="330.0" height="56.0" fill="#2e8b6a" stroke="none" stroke-width="0" rx="12"/><rect x="30.0" y="70.0" width="330.0" height="16.0" fill="#2e8b6a" stroke="none" stroke-width="0" rx="0"/><text font-size="26" fill="#ffffff" text-anchor="start" font-weight="700" data-box="b106"><tspan x="48.0" y="65.4">已確認</tspan></text><circle cx="55.0" cy="116.1" r="5" fill="#2e8b6a"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b106"><tspan x="70.0" y="123.8">Claude Tag 在 Slack </tspan><tspan x="70.0" y="154.2">多人共用、Team／</tspan><tspan x="70.0" y="184.5">Enterprise beta</tspan></text><circle cx="55.0" cy="217.5" r="5" fill="#2e8b6a"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b106"><tspan x="70.0" y="225.2">新版 Projects 以 </tspan><tspan x="70.0" y="255.5">coordinator 指揮多條 </tspan><tspan x="70.0" y="285.9">thread</tspan></text><circle cx="55.0" cy="318.8" r="5" fill="#2e8b6a"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b106"><tspan x="70.0" y="326.5">Cowork 內建瀏覽器在</tspan><tspan x="70.0" y="356.9">桌面版</tspan></text><circle cx="55.0" cy="389.8" r="5" fill="#2e8b6a"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b106"><tspan x="70.0" y="397.5">Cowork 與 chat 合併、</tspan><tspan x="70.0" y="427.9">Pro／Max 逐步推出</tspan></text><circle cx="55.0" cy="460.8" r="5" fill="#2e8b6a"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b106"><tspan x="70.0" y="468.5">〈Building effective </tspan><tspan x="70.0" y="498.9">agents〉建議先求最簡單</tspan></text><circle cx="55.0" cy="531.8" r="5" fill="#2e8b6a"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b106"><tspan x="70.0" y="539.5">Felix 說團隊為 Cowork </tspan><tspan x="70.0" y="569.9">衝刺了一週半（建立在約一</tspan><tspan x="70.0" y="600.2">年半的內部原型上，</tspan><tspan x="70.0" y="630.6">不是從零做起）</tspan></text><rect id="b107" x="380.0" y="30.0" width="330.0" height="627.4" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="12"/><rect x="380.0" y="30.0" width="330.0" height="56.0" fill="#2f6fdb" stroke="none" stroke-width="0" rx="12"/><rect x="380.0" y="70.0" width="330.0" height="16.0" fill="#2f6fdb" stroke="none" stroke-width="0" rx="0"/><text font-size="26" fill="#ffffff" text-anchor="start" font-weight="700" data-box="b107"><tspan x="398.0" y="65.4">當事方自揭</tspan></text><circle cx="405.0" cy="116.1" r="5" fill="#2f6fdb"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b107"><tspan x="420.0" y="123.8">一年半前還在當 Claude </tspan><tspan x="420.0" y="154.2">的輸送帶</tspan></text><circle cx="405.0" cy="187.1" r="5" fill="#2f6fdb"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b107"><tspan x="420.0" y="194.8">用裁判（judge）</tspan><tspan x="420.0" y="225.2">篩選批評的內部流程</tspan></text><circle cx="405.0" cy="258.1" r="5" fill="#2f6fdb"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b107"><tspan x="420.0" y="265.8">三步驟把回饋濃縮成原則</tspan></text><circle cx="405.0" cy="298.7" r="5" fill="#2f6fdb"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b107"><tspan x="420.0" y="306.4">不會用 Blender 卻用 3D </tspan><tspan x="420.0" y="336.8">素材重做網站</tspan></text><rect id="b108" x="730.0" y="30.0" width="330.0" height="627.4" fill="#fdf1e1" stroke="#c9892b" stroke-width="1.5" rx="12"/><rect x="730.0" y="30.0" width="330.0" height="56.0" fill="#c9892b" stroke="none" stroke-width="0" rx="12"/><rect x="730.0" y="70.0" width="330.0" height="16.0" fill="#c9892b" stroke="none" stroke-width="0" rx="0"/><text font-size="26" fill="#ffffff" text-anchor="start" font-weight="700" data-box="b108"><tspan x="748.0" y="65.4">單方說法</tspan></text><circle cx="755.0" cy="116.1" r="5" fill="#c9892b"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b108"><tspan x="770.0" y="123.8">官方建議「對 skill </tspan><tspan x="770.0" y="154.2">要非常小心」（書面文件無</tspan><tspan x="770.0" y="184.5">原句）</tspan></text><circle cx="755.0" cy="217.5" r="5" fill="#c9892b"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b108"><tspan x="770.0" y="225.2">Opus 5.5 在動態、影片、</tspan><tspan x="770.0" y="255.5">3D 大躍進（官方發布</tspan><tspan x="770.0" y="285.9">頁未提）</tspan></text><circle cx="755.0" cy="318.8" r="5" fill="#c9892b"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b108"><tspan x="770.0" y="326.5">在要求每個數字附一手</tspan><tspan x="770.0" y="356.9">來源的前提下，他自己</tspan><tspan x="770.0" y="387.2">對單一 agent 的事實</tspan><tspan x="770.0" y="417.6">查核「百分之百完全信任」</tspan></text><circle cx="755.0" cy="450.5" r="5" fill="#c9892b"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b108"><tspan x="770.0" y="458.2">審查「通常」可以用低一階</tspan><tspan x="770.0" y="488.6">的模型，看任務而定</tspan></text><circle cx="755.0" cy="521.5" r="5" fill="#c9892b"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b108"><tspan x="770.0" y="529.2">目前的經濟價值</tspan><tspan x="770.0" y="559.6">「大概大部分」來自自動化</tspan></text><rect id="b109" x="1080.0" y="30.0" width="330.0" height="627.4" fill="#fbe4e1" stroke="#d9483b" stroke-width="1.5" rx="12"/><rect x="1080.0" y="30.0" width="330.0" height="56.0" fill="#d9483b" stroke="none" stroke-width="0" rx="12"/><rect x="1080.0" y="70.0" width="330.0" height="16.0" fill="#d9483b" stroke="none" stroke-width="0" rx="0"/><text font-size="26" fill="#ffffff" text-anchor="start" font-weight="700" data-box="b109"><tspan x="1098.0" y="65.4">可疑</tspan></text><circle cx="1105.0" cy="116.1" r="5" fill="#d9483b"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b109"><tspan x="1120.0" y="123.8">數學奧賽銀牌到金牌「四、</tspan><tspan x="1120.0" y="154.2">五個月」（實際約一年）</tspan></text><circle cx="1105.0" cy="187.1" r="5" fill="#d9483b"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b109"><tspan x="1120.0" y="194.8">「NASA 正在確認」</tspan><tspan x="1120.0" y="225.2">新行星（實為候選，列入 </tspan><tspan x="1120.0" y="255.5">TESS 導演裁量目標名單與 </tspan><tspan x="1120.0" y="285.9">Sector 110 觀測清單）</tspan></text><text font-size="22" fill="#5b5b5b" text-anchor="start" font-weight="400"><tspan x="30.0" y="695.2">標示由本文依官方文件與當事人資料判定，截至 2026-10-24</tspan></text></svg>