<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 539" width="1440" height="539" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">從任務往上推到目標</title><desc id="d">兩組階梯，由低到高。當機：請修這一筆當機；讀全部當機資料，自己判斷修哪些；讓我們的 app 保持不當機（前提：能抓當機報告、對應版本與 commit、有三種作業系統的電腦可重現）。季度業務檢討：更新簡報模板裡的數字；這季變了什麼、為什麼、該怎麼做？；找出最急的三個決策，列正反論點；設計比季度簡報更早抓到問題的方法，並行跑一季。兩組上方一條虛線：天花板：「去賺錢」目前還不行。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="1440" height="539" fill="#f9f7f4"/><text font-size="28" fill="#d9483b" text-anchor="start" font-weight="700"><tspan x="30.0" y="49.2">天花板：『去賺錢』目前還不行</tspan></text><path d="M30.0,83.6 L1410.0,83.6" fill="none" stroke="#d9483b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="10 8"/><rect id="b61" x="30.0" y="395.8" width="670.0" height="65.1" fill="#e8f0fc" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b61"><tspan x="48.0" y="437.2">請修這一筆當機</tspan></text><rect id="b62" x="80.0" y="320.7" width="620.0" height="65.1" fill="#d6e4fa" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b62"><tspan x="98.0" y="362.1">讀全部當機資料，自己判斷修哪些</tspan></text><rect id="b63" x="130.0" y="245.6" width="570.0" height="65.1" fill="#c3d7f7" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b63"><tspan x="148.0" y="287.0">讓我們的 app 保持不當機</tspan></text><rect id="b64" x="30.0" y="113.6" width="670.0" height="96.0" fill="#ffffff" stroke="#c9892b" stroke-width="2" rx="12" stroke-dasharray="6 5"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b64"><tspan x="48.0" y="153.2">前提：能抓當機報告、對應版本與 commit、</tspan><tspan x="48.0" y="186.3">有三種作業系統的電腦可重現</tspan></text><path d="M415.0,211.6 L415.0,241.6" fill="none" stroke="#c9892b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b65" x="740.0" y="395.8" width="670.0" height="65.1" fill="#e8f0fc" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b65"><tspan x="758.0" y="437.2">更新簡報模板裡的數字</tspan></text><rect id="b66" x="790.0" y="320.7" width="620.0" height="65.1" fill="#d6e4fa" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b66"><tspan x="808.0" y="362.1">這季變了什麼、為什麼、該怎麼做？</tspan></text><rect id="b67" x="840.0" y="245.6" width="570.0" height="65.1" fill="#c3d7f7" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b67"><tspan x="858.0" y="287.0">找出最急的三個決策，列正反論點</tspan></text><rect id="b68" x="890.0" y="134.6" width="520.0" height="101.0" fill="#adc8f3" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b68"><tspan x="908.0" y="176.0">設計比季度簡報更早抓到問題的方法，</tspan><tspan x="908.0" y="211.9">並行跑一季</tspan></text><path d="M30.0,465.0 L1410.0,465.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/><text font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" y="504.2">當機</tspan></text><text font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1075.0" y="504.2">季度業務檢討</tspan></text></svg>