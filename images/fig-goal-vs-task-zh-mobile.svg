<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 628" width="600" height="628" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">從任務往上推到目標</title><desc id="d">兩組階梯，由低到高。當機：請修這一筆當機；讀全部當機資料，自己判斷修哪些；讓我們的 app 保持不當機（前提：能抓當機報告、對應版本與 commit、有三種作業系統的電腦可重現）。季度業務檢討：更新簡報模板裡的數字；這季變了什麼、為什麼、該怎麼做？；找出最急的三個決策，列正反論點；設計比季度簡報更早抓到問題的方法，並行跑一季。兩組上方一條虛線：天花板：「去賺錢」目前還不行。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="600" height="628" fill="#f9f7f4"/><text font-size="26" fill="#d9483b" text-anchor="start" font-weight="700"><tspan x="24.0" y="47.4">天花板：『去賺錢』目前還不行</tspan></text><path d="M24.0,81.2 L576.0,81.2" fill="none" stroke="#d9483b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="10 8"/><rect id="b69" x="24.0" y="497.4" width="270.0" height="54.9" fill="#e8f0fc" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b69"><tspan x="38.0" y="533.0">請修這一筆當機</tspan></text><rect id="b70" x="38.0" y="399.4" width="256.0" height="88.0" fill="#d6e4fa" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b70"><tspan x="52.0" y="435.0">讀全部當機資料，</tspan><tspan x="52.0" y="468.2">自己判斷修哪些</tspan></text><rect id="b71" x="52.0" y="301.4" width="242.0" height="88.0" fill="#c3d7f7" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b71"><tspan x="66.0" y="337.0">讓我們的 app </tspan><tspan x="66.0" y="370.2">保持不當機</tspan></text><rect id="b72" x="24.0" y="111.2" width="270.0" height="154.2" fill="#ffffff" stroke="#c9892b" stroke-width="2" rx="12" stroke-dasharray="6 5"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b72"><tspan x="38.0" y="146.8">前提：能抓當機報告、</tspan><tspan x="38.0" y="179.9">對應版本與 commit、</tspan><tspan x="38.0" y="213.0">有三種作業系統的</tspan><tspan x="38.0" y="246.2">電腦可重現</tspan></text><path d="M173.0,267.4 L173.0,297.4" fill="none" stroke="#c9892b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b73" x="306.0" y="497.4" width="270.0" height="54.9" fill="#e8f0fc" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b73"><tspan x="320.0" y="533.0">更新簡報模板裡的數字</tspan></text><rect id="b74" x="320.0" y="399.4" width="256.0" height="88.0" fill="#d6e4fa" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b74"><tspan x="334.0" y="435.0">這季變了什麼、</tspan><tspan x="334.0" y="468.2">為什麼、該怎麼做？</tspan></text><rect id="b75" x="334.0" y="301.4" width="242.0" height="88.0" fill="#c3d7f7" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b75"><tspan x="348.0" y="337.0">找出最急的三個</tspan><tspan x="348.0" y="370.2">決策，列正反論點</tspan></text><rect id="b76" x="348.0" y="170.3" width="228.0" height="121.1" fill="#adc8f3" stroke="#2f6fdb" stroke-width="2" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b76"><tspan x="362.0" y="205.9">設計比季度簡報</tspan><tspan x="362.0" y="239.0">更早抓到問題的</tspan><tspan x="362.0" y="272.2">方法，並行跑一季</tspan></text><path d="M24.0,556.3 L576.0,556.3" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="159.0" y="593.7">當機</tspan></text><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="441.0" y="593.7">季度業務檢討</tspan></text></svg>