<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1837" width="600" height="1837" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">訪談提到的產品與可用範圍</title><desc id="d">表格，五項產品（Claude Tag、新版 Projects、Cowork 內建瀏覽器、Cowork 與 chat 合併、Cowork 雲端執行）各列推出日期、可用方案範圍與要注意的限制。資料截至 2026-10-24。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="600" height="1837" fill="#f9f7f4"/><rect x="24.0" y="28.0" width="10.0" height="28.0" fill="#1a1a1a" stroke="none" stroke-width="1.5" rx="2"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="46.0" y="47.6">產品</tspan></text><rect x="300.0" y="28.0" width="10.0" height="28.0" fill="#2f6fdb" stroke="none" stroke-width="1.5" rx="2"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="322.0" y="47.6">日期</tspan></text><rect x="24.0" y="72.0" width="10.0" height="28.0" fill="#2e8b6a" stroke="none" stroke-width="1.5" rx="2"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="46.0" y="91.6">可用範圍</tspan></text><rect x="300.0" y="72.0" width="10.0" height="28.0" fill="#c9892b" stroke="none" stroke-width="1.5" rx="2"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="322.0" y="91.6">要注意</tspan></text><rect x="24.0" y="138.0" width="552.0" height="262.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.5" rx="12"/><rect id="b101" x="24.0" y="138.0" width="552.0" height="262.0" fill="none" stroke="none" stroke-width="0" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b101"><tspan x="42.0" y="179.4">Claude Tag（Slack 裡 @Claude）</tspan></text><rect x="42.0" y="203.1" width="6.0" height="60.0" fill="#2f6fdb" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b101"><tspan x="60.0" y="224.7">2026-06-23 推出；2026-10-20 Enterprise </tspan><tspan x="60.0" y="257.8">限定 API beta</tspan></text><rect x="42.0" y="279.1" width="6.0" height="26.9" fill="#2e8b6a" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b101"><tspan x="60.0" y="300.7">Team、Enterprise（beta）</tspan></text><rect x="42.0" y="322.0" width="6.0" height="60.0" fill="#c9892b" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b101"><tspan x="60.0" y="343.6">個人方案不能自己開通；Microsoft Teams </tspan><tspan x="60.0" y="376.7">版仍在候補登記</tspan></text><rect x="24.0" y="420.0" width="552.0" height="364.1" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.5" rx="12"/><rect id="b102" x="24.0" y="420.0" width="552.0" height="364.1" fill="none" stroke="none" stroke-width="0" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b102"><tspan x="42.0" y="461.4">新版 Projects（coordinator＋多條 </tspan><tspan x="42.0" y="497.3">thread）</tspan></text><rect x="42.0" y="521.0" width="6.0" height="26.9" fill="#2f6fdb" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b102"><tspan x="60.0" y="542.6">2026-09-17</tspan></text><rect x="42.0" y="563.9" width="6.0" height="93.1" fill="#2e8b6a" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b102"><tspan x="60.0" y="585.5">Pro、Max 公開 beta，逐步開放；</tspan><tspan x="60.0" y="618.6">先從用過雲端 session、且在 chat 或 </tspan><tspan x="60.0" y="651.7">Cowork 沒有既有 projects 的帳號開始</tspan></text><rect x="42.0" y="673.0" width="6.0" height="93.1" fill="#c9892b" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b102"><tspan x="60.0" y="694.6">thread 通常在雲端、也可在自己電腦上跑；</tspan><tspan x="60.0" y="727.7">Team／Enterprise 尚未提供；chat、</tspan><tspan x="60.0" y="760.8">Cowork 的既有 projects 升級無日期</tspan></text><rect x="24.0" y="804.1" width="552.0" height="460.7" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.5" rx="12"/><rect id="b103" x="24.0" y="804.1" width="552.0" height="460.7" fill="none" stroke="none" stroke-width="0" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b103"><tspan x="42.0" y="845.5">Cowork 內建瀏覽器</tspan></text><rect x="42.0" y="869.2" width="6.0" height="26.9" fill="#2f6fdb" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b103"><tspan x="60.0" y="890.8">2026-08-26</tspan></text><rect x="42.0" y="912.1" width="6.0" height="126.2" fill="#2e8b6a" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b103"><tspan x="60.0" y="933.7">桌面版（macOS、Windows、Linux </tspan><tspan x="60.0" y="966.8">beta）；發布文：Pro、Max、Team </tspan><tspan x="60.0" y="1000.0">一週內陸續推出，Enterprise </tspan><tspan x="60.0" y="1033.1">當天起由管理員管理</tspan></text><rect x="42.0" y="1054.4" width="6.0" height="192.5" fill="#c9892b" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b103"><tspan x="60.0" y="1076.0">網頁版、手機版需桌面程式開著；銀行、</tspan><tspan x="60.0" y="1109.1">email、SSO 預設不勾選；現行管理員文件：</tspan><tspan x="60.0" y="1142.2">Team 預設開啟，Enterprise 預設開啟、</tspan><tspan x="60.0" y="1175.3">除非已關閉（HIPAA 例外）；macOS 可從 </tspan><tspan x="60.0" y="1208.4">Chrome／Edge／Firefox 匯入，</tspan><tspan x="60.0" y="1241.6">Windows／Linux 只列 Firefox</tspan></text><rect x="24.0" y="1284.8" width="552.0" height="228.9" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.5" rx="12"/><rect id="b104" x="24.0" y="1284.8" width="552.0" height="228.9" fill="none" stroke="none" stroke-width="0" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b104"><tspan x="42.0" y="1326.2">Cowork 與 chat 合併為一個 Claude</tspan></text><rect x="42.0" y="1350.0" width="6.0" height="26.9" fill="#2f6fdb" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b104"><tspan x="60.0" y="1371.6">部落格標示 2026-09-16</tspan></text><rect x="42.0" y="1392.8" width="6.0" height="60.0" fill="#2e8b6a" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b104"><tspan x="60.0" y="1414.4">Pro、Max 逐步推出；Team beta；</tspan><tspan x="60.0" y="1447.6">Enterprise 10-23 宣布正式提供</tspan></text><rect x="42.0" y="1468.8" width="6.0" height="26.9" fill="#c9892b" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b104"><tspan x="60.0" y="1490.4">各帳號收到時間不同</tspan></text><rect x="24.0" y="1533.7" width="552.0" height="228.9" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.5" rx="12"/><rect id="b105" x="24.0" y="1533.7" width="552.0" height="228.9" fill="none" stroke="none" stroke-width="0" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b105"><tspan x="42.0" y="1575.1">Cowork 雲端執行</tspan></text><rect x="42.0" y="1598.8" width="6.0" height="26.9" fill="#2f6fdb" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b105"><tspan x="60.0" y="1620.4">2026-10-06 起</tspan></text><rect x="42.0" y="1641.7" width="6.0" height="26.9" fill="#2e8b6a" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b105"><tspan x="60.0" y="1663.3">Pro、Max 新建任務</tspan></text><rect x="42.0" y="1684.6" width="6.0" height="60.0" fill="#c9892b" stroke="none" stroke-width="1.5" rx="3"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b105"><tspan x="60.0" y="1706.2">10-06 前的本機任務留在本機；用本機檔案、</tspan><tspan x="60.0" y="1739.3">操作瀏覽器時桌面程式要開著</tspan></text><text font-size="24" fill="#5b5b5b" text-anchor="end" font-weight="400"><tspan x="576.0" y="1804.2">資料截至 2026-10-24</tspan></text></svg>