<tspan x="98.0" y="1115.4">40:00</tspan></text><path d="M104.0,1330.0 L112.0,1330.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/><text font-size="24" fill="#5b5b5b" text-anchor="end" font-weight="400"><tspan x="98.0" y="1339.6">49:23</tspan></text><path d="M146.0,150.0 L160.0,150.0 L184.0,150.0 L190.0,150.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linejoin="round"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="196.0" y="158.6">你對 AI 的要求太少了</tspan></text><path d="M146.0,223.3 L160.0,223.3 L184.0,223.3 L190.0,223.3" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linejoin="round"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="196.0" y="231.9">Felix 現在的一天</tspan></text><path d="M146.0,287.0 L160.0,287.0 L184.0,287.0 L190.0,287.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linejoin="round"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="196.0" y="295.6">用 AI 做以前做不到的事</tspan></text><path d="M146.0,322.4 L160.0,322.4 L184.0,325.0 L190.0,325.0" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linejoin="round"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="196.0" y="333.6">怎麼評斷 AI 的創作成果</tspan></text><path d="M146.0,422.4 L160.0,422.4 L184.0,422.4 L190.0,422.4" fill="none" stroke="#5b5b5b" stroke-width="1.3" stroke-linejoin="round"/><text font-size="24" fill="#5b5b5b" text-anchor="start" font-weight="700"><tspan x="196.0" y="431.0">業配</tspan></text><path d="M146.0,459.4 L160.0,459.4 L184.0,460.4 L190.0,460.4" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linejoin="round"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="196.0" y="469.0">抓出 AI 自信的錯誤</tspan></text><path d="M146.0,570.5 L160.0,570.5 L184.0,570.5 L190.0,570.5" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linejoin="round"/><text font-size="24"