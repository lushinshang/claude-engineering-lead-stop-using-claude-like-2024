<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 361" width="1440" height="361" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">把回饋變成審查原則</title><desc id="d">四步流程：第一步收齊你給過的所有回饋（Slack、GitHub、其他地方）；第二步請 Claude 濃縮成規則或原則清單；第三步（選用）問有哪些原則是我相信、但自己沒意識到的；之後把清單當審查輸入，先和 Claude 並行審幾輪、比對差異。第四步有一條虛線回到第二步：差異大就修正原則。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="1440" height="361" fill="#f9f7f4"/><rect id="b53" x="30.0" y="40.0" width="310.0" height="180.8" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b53"><tspan x="52.0" y="85.4">第一步：</tspan><tspan x="52.0" y="121.3">收齊你給過的所有回饋</tspan><tspan x="52.0" y="157.2">（Slack、GitHub、</tspan><tspan x="52.0" y="193.0">其他地方）</tspan></text><path d="M346.0,130.4 L384.0,130.4" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b54" x="390.0" y="40.0" width="310.0" height="180.8" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b54"><tspan x="412.0" y="103.3">第二步：</tspan><tspan x="412.0" y="139.2">請 Claude 濃縮成</tspan><tspan x="412.0" y="175.1">規則或原則清單</tspan></text><path d="M706.0,130.4 L744.0,130.4" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b55" x="750.0" y="40.0" width="310.0" height="180.8" fill="#ece6f5" stroke="#7b5ea7" stroke-width="2" rx="12" stroke-dasharray="8 6"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b55"><tspan x="772.0" y="85.4">第三步（選用）：</tspan><tspan x="772.0" y="121.3">問『有哪些原則是</tspan><tspan x="772.0" y="157.2">我相信、但自己</tspan><tspan x="772.0" y="193.0">沒意識到的』</tspan></text><path d="M1066.0,130.4 L1104.0,130.4" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b56" x="1110.0" y="40.0" width="310.0" height="180.8" fill="#dff1e8" stroke="#2e8b6a" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b56"><tspan x="1132.0" y="85.4">之後：</tspan><tspan x="1132.0" y="121.3">把清單當審查輸入，</tspan><tspan x="1132.0" y="157.2">先和 Claude </tspan><tspan x="1132.0" y="193.0">並行審幾輪、比對差異</tspan></text><path d="M1265.0,224.8 L1265.0,290.8 L545.0,290.8 L545.0,226.8" fill="none" stroke="#2e8b6a" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arr)"/><text font-size="26" fill="#2e8b6a" text-anchor="middle" font-weight="700"><tspan x="905.0" y="328.2">差異大就修正原則</tspan></text></svg>