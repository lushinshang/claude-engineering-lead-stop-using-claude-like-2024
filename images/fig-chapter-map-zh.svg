<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 872" width="1440" height="872" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">訪談 15 個章節時間軸</title><desc id="d">49 分 23 秒訪談的 15 個章節，依影片說明欄的起點秒數按比例排在時間軸上。藍色為本文主要引用的章節；灰色斜線色塊是非內容段落：10:39–12:09 業配、23:27–23:42 電子報廣告、34:28–34:59 觀眾問卷。「20 分鐘打造第一個 agent」一章整段落在電子報廣告區間內，以斜線色塊表示。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="1440" height="872" fill="#f9f7f4"/><rect x="60.0" y="26.0" width="34.0" height="24.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="106.0" y="45.6">本文主要引用</tspan></text><rect x="290.0" y="26.0" width="34.0" height="24.0" fill="url(#hatch)" stroke="#5b5b5b" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="336.0" y="45.6">非內容段落</tspan></text><rect x="60.0" y="92.0" width="76.4" height="26.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="150.4" y="111.6">你對 AI 的要求太少了</tspan></text><rect x="136.4" y="134.0" width="66.4" height="26.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="216.8" y="153.6">Felix 現在的一天</tspan></text><rect x="202.8" y="176.0" width="36.9" height="26.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="253.7" y="195.6">用 AI 做以前做不到的事</tspan></text><rect x="239.7" y="218.0" width="142.8" height="26.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="396.5" y="237.6">怎麼評斷 AI 的創作成果</tspan></text><rect x="382.5" y="260.0" width="115.8" height="26.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="512.4" y="279.6">抓出 AI 自信的錯誤</tspan></text><rect x="498.4" y="302.0" width="129.1" height="26.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="641.5" y="321.6">是不是把 agent 想太複雜</tspan></text><rect x="627.5" y="344.0" width="16.6" height="26.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="658.1" y="363.6">「我只是 Claude 的輸送帶」</tspan></text><rect x="644.1" y="386.0" width="16.2" height="26.0" fill="url(#hatch)" stroke="#5b5b5b" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="674.3" y="405.6">20 分鐘打造第一個 agent</tspan></text><rect x="660.3" y="428.0" width="25.7" height="26.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="700.0" y="447.6">給新手的上手建議</tspan></text><rect x="686.0" y="470.0" width="112.5" height="26.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="812.5" y="489.6">只說「你是專家」為什麼不夠</tspan></text><rect x="798.5" y="512.0" width="197.2" height="26.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="4"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="1009.7" y="531.6">不再當公司的瓶頸</tspan></text><rect x="995.