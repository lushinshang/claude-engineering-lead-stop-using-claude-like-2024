<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 668" width="1440" height="668" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">兩個桶子：要不要上重型審查</title><desc id="d">決策樹：先問「你知道好的成果長什麼樣嗎？」。不知道：多丟 AI 進去，用對抗式審查、裁判、更多 token；例如請 Claude 扮演研究員去「發現星星」，自己卻一竅不通。知道：像客戶一樣驗收成果，不必管過程；例如 Felix 不會用 Blender，但看得出網站好不好看。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="1440" height="668" fill="#f9f7f4"/><path id="b15" d="M720,30 L1020,150 L720,270 L420,150 Z" fill="#ece6f5" stroke="#7b5ea7" stroke-width="2"/><text font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b15"><tspan x="720.0" y="139.5">你知道好的成果</tspan><tspan x="720.0" y="180.9">長什麼樣嗎？</tspan></text><path d="M420.0,150.0 L360.0,150.0 L360.0,356.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1020.0,150.0 L1080.0,150.0 L1080.0,356.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-size="28" fill="#c9892b" text-anchor="end" font-weight="700"><tspan x="344.0" y="255.2">不知道</tspan></text><text font-size="28" fill="#2e8b6a" text-anchor="start" font-weight="700"><tspan x="1096.0" y="255.2">知道</tspan></text><rect id="b16" x="80.0" y="360.0" width="560.0" height="118.0" fill="#fdf1e1" stroke="#c9892b" stroke-width="2" rx="12"/><text font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b16"><tspan x="360.0" y="409.2">多丟 AI 進去：</tspan><tspan x="360.0" y="447.8">對抗式審查、裁判、更多 token</tspan></text><rect id="b17" x="800.0" y="360.0" width="560.0" height="118.0" fill="#dff1e8" stroke="#2e8b6a" stroke-width="2" rx="12"/><text font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b17"><tspan x="1080.0" y="428.5">像客戶一樣驗收成果，不必管過程</tspan></text><path d="M360.0,478.0 L360.0,528.0" fill="none" stroke="#d9d6d0" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M1080.0,478.0 L1080.0,528.0" fill="none" stroke="#d9d6d0" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 5"/><rect id="b18" x="100.0" y="528.0" width="520.0" height="100.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="2" rx="12" stroke-dasharray="6 5"/><text font-size="24" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b18"><tspan x="360.0" y="569.6">例：請 Claude 扮演研究員去</tspan><tspan x="360.0" y="602.7">『發現星星』，自己卻一竅不通</tspan></text><rect id="b19" x="820.0" y="528.0" width="520.0" height="100.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="2" rx="12" stroke-dasharray="6 5"/><text font-size="24" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b19"><tspan x="1080.0" y="569.6">例：Felix 不會用 Blender，</tspan><tspan x="1080.0" y="602.7">但看得出網站好不好看</tspan></text></svg>