<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">對抗式審查流程</title><desc id="d">流程圖：做事的 Claude 工作階段產出初稿後，另開新的工作階段分出三個攻擊者（代表），分別證明事實有誤、思考方向不對、誤解了某些東西；批評送到裁判（judge）判斷哪些成立；成立的回饋回到原作者 A，由它自己決定要不要採納，不成立的批評丟棄。附註：Felix 說看任務而定，攻擊者通常可以用低一階的模型；他說「另外分出十個」，示範時開了五條。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="1440" height="800" fill="#f9f7f4"/><rect id="b1" x="24.0" y="270.0" width="200.0" height="180.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b1"><tspan x="124.0" y="335.0">做事的 Claude </tspan><tspan x="124.0" y="368.2">工作階段：</tspan><tspan x="124.0" y="401.3">產出初稿</tspan></text><path d="M224.0,360.0 L254.0,360.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M254.0,150.0 L254.0,570.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M254.0,150.0 L440.0,150.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b2" x="444.0" y="92.0" width="280.0" height="116.0" fill="#fbe4e1" stroke="#d9483b" stroke-width="2" rx="12"/><text font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b2"><tspan x="584.0" y="141.6">攻擊者 1：</tspan><tspan x="584.0" y="174.7">證明事實有誤</tspan></text><path d="M724.0,150.0 L754.0,150.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M254.0,360.0 L440.0,360.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b3" x="444.0" y="302.0" width="280.0" height="116.0" fill="#fbe4e1" stroke="#d9483b" stroke-width="2" rx="12"/><text font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b3"><tspan x="584.0" y="351.6">攻擊者 2：</tspan><tspan x="584.0" y="384.7">證明思考方向不對</tspan></text><path d="M724.0,360.0 L754.0,360.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M254.0,570.0 L440.0,570.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b4" x="444.0" y="512.0" width="280.0" height="116.0" fill="#fbe4e1" stroke="#d9483b" stroke-width="2" rx="12"/><text font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b4"><tspan x="584.0" y="561.6">攻擊者 3：</tspan><tspan x="584.0" y="594.7">證明誤解了某些東西</tspan></text><path d="M724.0,570.0 L754.0,570.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><text font-size="22" fill="#5b5b5b" text-anchor="middle" font-weight="700"><tspan x="349.0" y="125.8">另開新的工作階段</tspan></text><path d="M754.0,150.0 L754.0,570.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M754.0,360.0 L810.0,360.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-size="22" fill="#5b5b5b" text-anchor="middle" font-weight="700"><tspan x="784.0" y="339.8">批評</tspan></text><rect id="b5" x="814.0" y="270.0" width="240.0" height="180.0" fill="#fdf1e1" stroke="#c9892b" stroke-width="2" rx="12"/><text font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b5"><tspan x="934.0" y="351.6">裁判（judge）：</tspan><tspan x="934.0" y="384.7">判斷哪些批評成立</tspan></text><path d="M1054.0,360.0 L1084.0,360.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M1084.0,230.0 L1084.0,500.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M1084.0,230.0 L1206.0,230.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1084.0,500.0 L1206.0,500.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arr)"/><text font-size="22" fill="#2e8b6a" text-anchor="middle" font-weight="700"><tspan x="1147.0" y="209.8">成立的回饋</tspan></text><text font-size="22" fill="#5b5b5b" text-anchor="middle" font-weight="700"><tspan x="1147.0" y="479.8">不成立</tspan></text><rect id="b6" x="1210.0" y="145.0" width="206.0" height="170.0" fill="#dff1e8" stroke="#2e8b6a" stroke-width="2" rx="12"/><text font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b6"><tspan x="1313.0" y="205.0">回到 A：</tspan><tspan x="1313.0" y="238.2">自己決定</tspan><tspan x="1313.0" y="271.3">要不要採納</tspan></text><rect id="b7" x="1210.0" y="440.0" width="206.0" height="120.0" fill="#ffffff" stroke="#5b5b5b" stroke-width="2" rx="12" stroke-dasharray="8 6"/><text font-size="22" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b7"><tspan x="1313.0" y="492.3">不成立的批評：</tspan><tspan x="1313.0" y="522.7">丟棄</tspan></text><text font-size="22" fill="#5b5b5b" text-anchor="end" font-weight="400"><tspan x="1410.0" y="709.8">Felix 說看任務而定，攻擊者通常可以用低一階的模型</tspan></text><text font-size="22" fill="#5b5b5b" text-anchor="end" font-weight="400"><tspan x="1410.0" y="747.8">攻擊者數量：他說『另外分出十個』，示範時開了五條</tspan></text></svg>