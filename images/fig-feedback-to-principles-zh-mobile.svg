<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 630" width="600" height="630" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">把回饋變成審查原則</title><desc id="d">四步流程：第一步收齊你給過的所有回饋（Slack、GitHub、其他地方）；第二步請 Claude 濃縮成規則或原則清單；第三步（選用）問有哪些原則是我相信、但自己沒意識到的；之後把清單當審查輸入，先和 Claude 並行審幾輪、比對差異。第四步有一條虛線回到第二步：差異大就修正原則。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="600" height="630" fill="#f9f7f4"/><rect id="b57" x="24.0" y="30.0" width="430.0" height="105.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b57"><tspan x="44.0" y="73.4">第一步：收齊你給過的所有回饋</tspan><tspan x="44.0" y="109.3">（Slack、GitHub、其他地方）</tspan></text><path d="M239.0,139.0 L239.0,179.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b58" x="24.0" y="185.0" width="430.0" height="105.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b58"><tspan x="44.0" y="228.4">第二步：請 Claude </tspan><tspan x="44.0" y="264.3">濃縮成規則或原則清單</tspan></text><path d="M239.0,294.0 L239.0,334.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b59" x="24.0" y="340.0" width="430.0" height="105.0" fill="#ece6f5" stroke="#7b5ea7" stroke-width="2" rx="12" stroke-dasharray="8 6"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b59"><tspan x="44.0" y="383.4">第三步（選用）：問『有哪些原則</tspan><tspan x="44.0" y="419.3">是我相信、但自己沒意識到的』</tspan></text><path d="M239.0,449.0 L239.0,489.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b60" x="24.0" y="495.0" width="430.0" height="105.0" fill="#dff1e8" stroke="#2e8b6a" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b60"><tspan x="44.0" y="538.4">之後：把清單當審查輸入，先和 </tspan><tspan x="44.0" y="574.3">Claude 並行審幾輪、比對差異</tspan></text><path d="M458.0,547.5 L484.0,547.5 L484.0,237.5 L462.0,237.5" fill="none" stroke="#2e8b6a" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arr)"/><text font-size="24" fill="#2e8b6a" text-anchor="start" font-weight="700"><tspan x="496.0" y="380.1">差異大就</tspan><tspan x="496.0" y="413.2">修正原則</tspan></text></svg>