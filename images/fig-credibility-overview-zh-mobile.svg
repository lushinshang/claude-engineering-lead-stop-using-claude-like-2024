<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1590" width="600" height="1590" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">訪談說法可信度分類</title><desc id="d">四欄分類。已確認：Claude Tag、新版 Projects、Cowork 內建瀏覽器、Cowork 與 chat 合併、〈Building effective agents〉建議先求最簡單、Cowork 衝刺一週半（建立在約一年半的內部原型上）。當事方自揭：輸送帶時期、裁判內部流程、三步驟濃縮原則、不會用 Blender 卻用 3D 素材重做網站。單方說法：官方建議對 skill 要非常小心、Opus 5.5 動態影片 3D 大躍進、在要求每個數字附一手來源的前提下，他自己對單一 agent 的事實查核百分之百完全信任；審查通常可以用低一階的模型，看任務而定；目前的經濟價值大概大部分來自自動化。可疑：數學奧賽銀牌到金牌「四、五個月」（實際約一年）、「NASA 正在確認」新行星（實為候選）。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="600" height="1590" fill="#f9f7f4"/><rect x="24.0" y="24.0" width="552.0" height="453.8" fill="#dff1e8" stroke="#2e8b6a" stroke-width="1.5" rx="12"/><rect x="24.0" y="24.0" width="552.0" height="54.0" fill="#2e8b6a" stroke="none" stroke-width="0" rx="12"/><rect x="24.0" y="62.0" width="552.0" height="16.0" fill="#2e8b6a" stroke="none" stroke-width="0" rx="0"/><text font-size="26" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="42.0" y="58.4">已確認</tspan></text><circle cx="49.0" cy="109.2" r="5" fill="#2e8b6a"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="117.6">Claude Tag 在 Slack 多人共用、</tspan><tspan x="64.0" y="150.7">Team／Enterprise beta</tspan></text><circle cx="49.0" cy="183.2" r="5" fill="#2e8b6a"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="191.6">新版 Projects 以 coordinator 指揮多條 </tspan><tspan x="64.0" y="224.7">thread</tspan></text><circle cx="49.0" cy="257.2" r="5" fill="#2e8b6a"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="265.6">Cowork 內建瀏覽器在桌面版</tspan></text><circle cx="49.0" cy="298.1" r="5" fill="#2e8b6a"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="306.5">Cowork 與 chat 合併、Pro／Max 逐步推出</tspan></text><circle cx="49.0" cy="339.0" r="5" fill="#2e8b6a"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="347.4">〈Building effective agents〉建議先求</tspan><tspan x="64.0" y="380.5">最簡單</tspan></text><circle cx="49.0" cy="413.0" r="5" fill="#2e8b6a"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="421.4">Felix 說團隊為 Cowork 衝刺了一週半（建立</tspan><tspan x="64.0" y="454.5">在約一年半的內部原型上，不是從零做起）</tspan></text><rect x="24.0" y="497.8" width="552.0" height="239.5" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="12"/><rect x="24.0" y="497.8" width="552.0" height="54.0" fill="#2f6fdb" stroke="none" stroke-width="0" rx="12"/><rect x="24.0" y="535.8" width="552.0" height="16.0" fill="#2f6fdb" stroke="none" stroke-width="0" rx="0"/><text font-size="26" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="42.0" y="532.2">當事方自揭</tspan></text><circle cx="49.0" cy="583.0" r="5" fill="#2f6fdb"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="591.4">一年半前還在當 Claude 的輸送帶</tspan></text><circle cx="49.0" cy="623.8" r="5" fill="#2f6fdb"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="632.2">用裁判（judge）篩選批評的內部流程</tspan></text><circle cx="49.0" cy="664.7" r="5" fill="#2f6fdb"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="673.1">三步驟把回饋濃縮成原則</tspan></text><circle cx="49.0" cy="705.6" r="5" fill="#2f6fdb"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="714.0">不會用 Blender 卻用 3D 素材重做網站</tspan></text><rect x="24.0" y="757.3" width="552.0" height="446.0" fill="#fdf1e1" stroke="#c9892b" stroke-width="1.5" rx="12"/><rect x="24.0" y="757.3" width="552.0" height="54.0" fill="#c9892b" stroke="none" stroke-width="0" rx="12"/><rect x="24.0" y="795.3" width="552.0" height="16.0" fill="#c9892b" stroke="none" stroke-width="0" rx="0"/><text font-size="26" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="42.0" y="791.7">單方說法</tspan></text><circle cx="49.0" cy="842.5" r="5" fill="#c9892b"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="850.9">官方建議「對 skill 要非常小心」</tspan><tspan x="64.0" y="884.0">（書面文件無原句）</tspan></text><circle cx="49.0" cy="916.5" r="5" fill="#c9892b"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="924.9">Opus 5.5 在動態、影片、3D </tspan><tspan x="64.0" y="958.0">大躍進（官方發布頁未提）</tspan></text><circle cx="49.0" cy="990.5" r="5" fill="#c9892b"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="998.9">在要求每個數字附一手來源的前提下，</tspan><tspan x="64.0" y="1032.0">他自己對單一 agent 的事實查核「百分之百完</tspan><tspan x="64.0" y="1065.1">全信任」</tspan></text><circle cx="49.0" cy="1097.6" r="5" fill="#c9892b"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="1106.0">審查「通常」可以用低一階的模型，</tspan><tspan x="64.0" y="1139.1">看任務而定</tspan></text><circle cx="49.0" cy="1171.6" r="5" fill="#c9892b"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="1180.0">目前的經濟價值「大概大部分」來自自動化</tspan></text><rect x="24.0" y="1223.3" width="552.0" height="257.1" fill="#fbe4e1" stroke="#d9483b" stroke-width="1.5" rx="12"/><rect x="24.0" y="1223.3" width="552.0" height="54.0" fill="#d9483b" stroke="none" stroke-width="0" rx="12"/><rect x="24.0" y="1261.3" width="552.0" height="16.0" fill="#d9483b" stroke="none" stroke-width="0" rx="0"/><text font-size="26" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="42.0" y="1257.7">可疑</tspan></text><circle cx="49.0" cy="1308.5" r="5" fill="#d9483b"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="1316.9">數學奧賽銀牌到金牌「四、五個月」</tspan><tspan x="64.0" y="1350.0">（實際約一年）</tspan></text><circle cx="49.0" cy="1382.5" r="5" fill="#d9483b"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan x="64.0" y="1390.9">「NASA 正在確認」新行星（實為候選，列入 </tspan><tspan x="64.0" y="1424.0">TESS 導演裁量目標名單與 Sector 110 </tspan><tspan x="64.0" y="1457.1">觀測清單）</tspan></text><text font-size="24" fill="#5b5b5b" text-anchor="start" font-weight="400"><tspan x="24.0" y="1522.0">標示由本文依官方文件與當事人資料判定，截至 </tspan><tspan x="24.0" y="1555.1">2026-10-24</tspan></text></svg>