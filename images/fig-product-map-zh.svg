<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" width="1440" height="840" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">訪談提到的產品與可用範圍</title><desc id="d">表格，五項產品（Claude Tag、新版 Projects、Cowork 內建瀏覽器、Cowork 與 chat 合併、Cowork 雲端執行）各列推出日期、可用方案範圍與要注意的限制。資料截至 2026-10-24。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="1440" height="840" fill="#f9f7f4"/><rect id="b77" x="30.0" y="30.0" width="250.0" height="52.0" fill="#dfe7f3" stroke="none" stroke-width="2" rx="0"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b77"><tspan x="44.0" y="64.2">產品</tspan></text><rect id="b78" x="280.0" y="30.0" width="290.0" height="52.0" fill="#e3ecfb" stroke="none" stroke-width="2" rx="0"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b78"><tspan x="294.0" y="64.2">日期</tspan></text><rect id="b79" x="570.0" y="30.0" width="400.0" height="52.0" fill="#dff1e8" stroke="none" stroke-width="2" rx="0"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b79"><tspan x="584.0" y="64.2">可用範圍</tspan></text><rect id="b80" x="970.0" y="30.0" width="440.0" height="52.0" fill="#fdf1e1" stroke="none" stroke-width="2" rx="0"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b80"><tspan x="984.0" y="64.2">要注意</tspan></text><rect x="30.0" y="82.0" width="1380.0" height="113.4" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><rect id="b81" x="30.0" y="82.0" width="250.0" height="113.4" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b81"><tspan x="44.0" y="115.8">Claude Tag</tspan><tspan x="44.0" y="146.2">（Slack 裡 @Claude）</tspan></text><rect id="b82" x="280.0" y="82.0" width="290.0" height="113.4" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b82"><tspan x="294.0" y="115.8">2026-06-23 推出；</tspan><tspan x="294.0" y="146.2">2026-10-20 Enterprise </tspan><tspan x="294.0" y="176.5">限定 API beta</tspan></text><rect id="b83" x="570.0" y="82.0" width="400.0" height="113.4" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b83"><tspan x="584.0" y="115.8">Team、Enterprise（beta）</tspan></text><rect id="b84" x="970.0" y="82.0" width="440.0" height="113.4" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b84"><tspan x="984.0" y="115.8">個人方案不能自己開通；Microsoft </tspan><tspan x="984.0" y="146.2">Teams 版仍在候補登記</tspan></text><path d="M30.0,195.4 L1410.0,195.4" fill="none" stroke="#d9d6d0" stroke-width="1.2" stroke-linejoin="round"/><rect x="30.0" y="195.4" width="1380.0" height="143.7" fill="#fbfaf8" stroke="none" stroke-width="0" rx="0"/><rect id="b85" x="30.0" y="195.4" width="250.0" height="143.7" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b85"><tspan x="44.0" y="229.2">新版 Projects</tspan><tspan x="44.0" y="259.5">（coordinator＋</tspan><tspan x="44.0" y="289.9">多條 thread）</tspan></text><rect id="b86" x="280.0" y="195.4" width="290.0" height="143.7" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b86"><tspan x="294.0" y="229.2">2026-09-17</tspan></text><rect id="b87" x="570.0" y="195.4" width="400.0" height="143.7" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b87"><tspan x="584.0" y="229.2">Pro、Max 公開 beta，逐步開放；</tspan><tspan x="584.0" y="259.5">先從用過雲端 session、且在 chat </tspan><tspan x="584.0" y="289.9">或 Cowork 沒有既有 projects </tspan><tspan x="584.0" y="320.2">的帳號開始</tspan></text><rect id="b88" x="970.0" y="195.4" width="440.0" height="143.7" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b88"><tspan x="984.0" y="229.2">thread 通常在雲端、也可在自己電腦上</tspan><tspan x="984.0" y="259.5">跑；Team／Enterprise 尚未提供；</tspan><tspan x="984.0" y="289.9">chat、Cowork 的既有 projects </tspan><tspan x="984.0" y="320.2">升級無日期</tspan></text><path d="M30.0,339.1 L1410.0,339.1" fill="none" stroke="#d9d6d0" stroke-width="1.2" stroke-linejoin="round"/><rect x="30.0" y="339.1" width="1380.0" height="234.8" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><rect id="b89" x="30.0" y="339.1" width="250.0" height="234.8" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b89"><tspan x="44.0" y="372.9">Cowork 內建瀏覽器</tspan></text><rect id="b90" x="280.0" y="339.1" width="290.0" height="234.8" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b90"><tspan x="294.0" y="372.9">2026-08-26</tspan></text><rect id="b91" x="570.0" y="339.1" width="400.0" height="234.8" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b91"><tspan x="584.0" y="372.9">桌面版（macOS、Windows、Linux </tspan><tspan x="584.0" y="403.2">beta）；發布文：Pro、Max、Team </tspan><tspan x="584.0" y="433.6">一週內陸續推出，Enterprise </tspan><tspan x="584.0" y="464.0">當天起由管理員管理</tspan></text><rect id="b92" x="970.0" y="339.1" width="440.0" height="234.8" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b92"><tspan x="984.0" y="372.9">網頁版、手機版需桌面程式開著；銀行、</tspan><tspan x="984.0" y="403.2">email、SSO 預設不勾選；</tspan><tspan x="984.0" y="433.6">現行管理員文件：Team 預設開啟，</tspan><tspan x="984.0" y="464.0">Enterprise 預設開啟、除非已關閉</tspan><tspan x="984.0" y="494.3">（HIPAA 例外）；macOS 可從 </tspan><tspan x="984.0" y="524.7">Chrome／Edge／Firefox 匯入，</tspan><tspan x="984.0" y="555.0">Windows／Linux 只列 Firefox</tspan></text><path d="M30.0,573.9 L1410.0,573.9" fill="none" stroke="#d9d6d0" stroke-width="1.2" stroke-linejoin="round"/><rect x="30.0" y="573.9" width="1380.0" height="83.0" fill="#fbfaf8" stroke="none" stroke-width="0" rx="0"/><rect id="b93" x="30.0" y="573.9" width="250.0" height="83.0" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b93"><tspan x="44.0" y="607.7">Cowork 與 chat </tspan><tspan x="44.0" y="638.0">合併為一個 Claude</tspan></text><rect id="b94" x="280.0" y="573.9" width="290.0" height="83.0" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b94"><tspan x="294.0" y="607.7">部落格標示 2026-09-16</tspan></text><rect id="b95" x="570.0" y="573.9" width="400.0" height="83.0" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b95"><tspan x="584.0" y="607.7">Pro、Max 逐步推出；Team beta；</tspan><tspan x="584.0" y="638.0">Enterprise 10-23 宣布正式提供</tspan></text><rect id="b96" x="970.0" y="573.9" width="440.0" height="83.0" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b96"><tspan x="984.0" y="607.7">各帳號收到時間不同</tspan></text><path d="M30.0,656.9 L1410.0,656.9" fill="none" stroke="#d9d6d0" stroke-width="1.2" stroke-linejoin="round"/><rect x="30.0" y="656.9" width="1380.0" height="113.4" fill="#ffffff" stroke="none" stroke-width="0" rx="0"/><rect id="b97" x="30.0" y="656.9" width="250.0" height="113.4" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b97"><tspan x="44.0" y="690.7">Cowork 雲端執行</tspan></text><rect id="b98" x="280.0" y="656.9" width="290.0" height="113.4" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b98"><tspan x="294.0" y="690.7">2026-10-06 起</tspan></text><rect id="b99" x="570.0" y="656.9" width="400.0" height="113.4" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b99"><tspan x="584.0" y="690.7">Pro、Max 新建任務</tspan></text><rect id="b100" x="970.0" y="656.9" width="440.0" height="113.4" fill="none" stroke="none" stroke-width="0" rx="0"/><text font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" data-box="b100"><tspan x="984.0" y="690.7">10-06 前的本機任務留在本機；</tspan><tspan x="984.0" y="721.0">用本機檔案、操作瀏覽器時桌面程式</tspan><tspan x="984.0" y="751.4">要開著</tspan></text><path d="M30.0,770.2 L1410.0,770.2" fill="none" stroke="#d9d6d0" stroke-width="1.2" stroke-linejoin="round"/><path d="M280.0,30.0 L280.0,770.2" fill="none" stroke="#d9d6d0" stroke-width="1.2" stroke-linejoin="round"/><path d="M570.0,30.0 L570.0,770.2" fill="none" stroke="#d9d6d0" stroke-width="1.2" stroke-linejoin="round"/><path d="M970.0,30.0 L970.0,770.2" fill="none" stroke="#d9d6d0" stroke-width="1.2" stroke-linejoin="round"/><rect x="30.0" y="30.0" width="1380.0" height="740.2" fill="none" stroke="#d9d6d0" stroke-width="1.5" rx="0"/><text font-size="22" fill="#5b5b5b" text-anchor="end" font-weight="400"><tspan x="1410.0" y="808.0">資料截至 2026-10-24</tspan></text></svg>