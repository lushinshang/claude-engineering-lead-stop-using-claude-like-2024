<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" width="1440" height="680" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">2024 式用法與新用法對照</title><desc id="d">對照表，五個面向。交辦內容：「幫我摘要這封信」對交出你期待的結果。提示詞開頭：「你是一位優秀的工程師」對「這個領域最頂尖的人用什麼工具？照那樣做」。資料：切好一片餵給指定的 agent 對開放完整資料、寫清楚工具說明。驗證：叫同一個工作階段自己檢查對另開工作階段挑錯、優先找外部證據。人的位置：一筆筆搬工單的輸送帶對定目標、驗收結果。註：右欄是 Felix 的個人做法，官方文件另有不同寫法。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="1440" height="680" fill="#f9f7f4"/><rect id="b25" x="30.0" y="30.0" width="220.0" height="64.0" fill="none" stroke="none" stroke-width="2" rx="12"/><text font-size="24" fill="#5b5b5b" text-anchor="middle" font-weight="700" data-box="b25"><tspan x="140.0" y="70.2">面向</tspan></text><rect id="b26" x="270.0" y="30.0" width="520.0" height="64.0" fill="#dcdad5" stroke="none" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b26"><tspan x="530.0" y="70.8">2024 式用法</tspan></text><rect id="b27" x="850.0" y="30.0" width="560.0" height="64.0" fill="#2f6fdb" stroke="none" stroke-width="2" rx="12"/><text font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700" data-box="b27"><tspan x="1130.0" y="70.8">Felix 主張的用法</tspan></text><rect id="b28" x="30.0" y="108.0" width="220.0" height="84.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b28"><tspan x="140.0" y="158.8">交辦內容</tspan></text><rect id="b29" x="270.0" y="108.0" width="520.0" height="84.0" fill="#ecebe8" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b29"><tspan x="530.0" y="158.8">「幫我摘要這封信」</tspan></text><rect id="b30" x="850.0" y="108.0" width="560.0" height="84.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b30"><tspan x="1130.0" y="158.8">交出你期待的結果</tspan></text><path d="M798.0,150.0 L842.0,150.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b31" x="30.0" y="204.0" width="220.0" height="109.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b31"><tspan x="140.0" y="267.3">提示詞開頭</tspan></text><rect id="b32" x="270.0" y="204.0" width="520.0" height="109.0" fill="#ecebe8" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b32"><tspan x="530.0" y="267.3">「你是一位優秀的工程師」</tspan></text><rect id="b33" x="850.0" y="204.0" width="560.0" height="109.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b33"><tspan x="1130.0" y="249.4">「這個領域最頂尖的人用什麼工具？</tspan><tspan x="1130.0" y="285.3">照那樣做」</tspan></text><path d="M798.0,258.5 L842.0,258.5" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b34" x="30.0" y="325.0" width="220.0" height="84.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b34"><tspan x="140.0" y="375.8">資料</tspan></text><rect id="b35" x="270.0" y="325.0" width="520.0" height="84.0" fill="#ecebe8" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b35"><tspan x="530.0" y="375.8">切好一片，餵給指定的 agent</tspan></text><rect id="b36" x="850.0" y="325.0" width="560.0" height="84.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b36"><tspan x="1130.0" y="375.8">開放完整資料，寫清楚工具說明</tspan></text><path d="M798.0,367.0 L842.0,367.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b37" x="30.0" y="421.0" width="220.0" height="84.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b37"><tspan x="140.0" y="471.8">驗證</tspan></text><rect id="b38" x="270.0" y="421.0" width="520.0" height="84.0" fill="#ecebe8" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b38"><tspan x="530.0" y="471.8">叫同一個工作階段自己檢查</tspan></text><rect id="b39" x="850.0" y="421.0" width="560.0" height="84.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b39"><tspan x="1130.0" y="471.8">另開工作階段挑錯，優先找外部證據</tspan></text><path d="M798.0,463.0 L842.0,463.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b40" x="30.0" y="517.0" width="220.0" height="84.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b40"><tspan x="140.0" y="567.8">人的位置</tspan></text><rect id="b41" x="270.0" y="517.0" width="520.0" height="84.0" fill="#ecebe8" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b41"><tspan x="530.0" y="567.8">一筆筆搬工單的輸送帶</tspan></text><rect id="b42" x="850.0" y="517.0" width="560.0" height="84.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b42"><tspan x="1130.0" y="567.8">定目標、驗收結果</tspan></text><path d="M798.0,559.0 L842.0,559.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-size="22" fill="#5b5b5b" text-anchor="start" font-weight="400"><tspan x="30.0" y="644.8">右欄是 Felix 的個人做法；官方文件對角色設定與自我驗證另有不同寫法，見內文。</tspan></text></svg>