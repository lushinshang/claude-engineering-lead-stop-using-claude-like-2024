<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1481" width="600" height="1481" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">2024 式用法與新用法對照</title><desc id="d">對照表，五個面向。交辦內容：「幫我摘要這封信」對交出你期待的結果。提示詞開頭：「你是一位優秀的工程師」對「這個領域最頂尖的人用什麼工具？照那樣做」。資料：切好一片餵給指定的 agent 對開放完整資料、寫清楚工具說明。驗證：叫同一個工作階段自己檢查對另開工作階段挑錯、優先找外部證據。人的位置：一筆筆搬工單的輸送帶對定目標、驗收結果。註：右欄是 Felix 的個人做法，官方文件另有不同寫法。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="600" height="1481" fill="#f9f7f4"/><rect x="24.0" y="30.0" width="10.0" height="26.0" fill="#1a1a1a" stroke="none" stroke-width="1.5" rx="2"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="46.0" y="49.6">面向</tspan></text><rect x="170.0" y="28.0" width="30.0" height="30.0" fill="#ecebe8" stroke="#d9d6d0" stroke-width="1.5" rx="6"/><text font-size="24" fill="#5b5b5b" text-anchor="start" font-weight="700"><tspan x="210.0" y="49.6">2024 式用法</tspan></text><rect x="170.0" y="74.0" width="30.0" height="30.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="1.5" rx="6"/><text font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="210.0" y="95.6">Felix 主張的用法</tspan></text><rect x="24.0" y="136.0" width="10.0" height="28.0" fill="#1a1a1a" stroke="none" stroke-width="1.5" rx="2"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="46.0" y="157.4">交辦內容</tspan></text><rect id="b43" x="24.0" y="178.0" width="552.0" height="65.1" fill="#ecebe8" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#5b5b5b" text-anchor="start" font-weight="400" data-box="b43"><tspan x="42.0" y="219.4">「幫我摘要這封信」</tspan></text><path d="M300.0,245.1 L300.0,273.1" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b44" x="24.0" y="277.1" width="552.0" height="65.1" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b44"><tspan x="42.0" y="318.5">交出你期待的結果</tspan></text><rect x="24.0" y="380.2" width="10.0" height="28.0" fill="#1a1a1a" stroke="none" stroke-width="1.5" rx="2"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="46.0" y="401.6">提示詞開頭</tspan></text><rect id="b45" x="24.0" y="422.2" width="552.0" height="65.1" fill="#ecebe8" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#5b5b5b" text-anchor="start" font-weight="400" data-box="b45"><tspan x="42.0" y="463.6">「你是一位優秀的工程師」</tspan></text><path d="M300.0,489.4 L300.0,517.4" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b46" x="24.0" y="521.4" width="552.0" height="101.0" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b46"><tspan x="42.0" y="562.8">「這個領域最頂尖的人用什麼工具？</tspan><tspan x="42.0" y="598.6">照那樣做」</tspan></text><rect x="24.0" y="660.4" width="10.0" height="28.0" fill="#1a1a1a" stroke="none" stroke-width="1.5" rx="2"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="46.0" y="681.8">資料</tspan></text><rect id="b47" x="24.0" y="702.4" width="552.0" height="65.1" fill="#ecebe8" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#5b5b5b" text-anchor="start" font-weight="400" data-box="b47"><tspan x="42.0" y="743.8">切好一片，餵給指定的 agent</tspan></text><path d="M300.0,769.5 L300.0,797.5" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b48" x="24.0" y="801.5" width="552.0" height="65.1" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b48"><tspan x="42.0" y="842.9">開放完整資料，寫清楚工具說明</tspan></text><rect x="24.0" y="904.6" width="10.0" height="28.0" fill="#1a1a1a" stroke="none" stroke-width="1.5" rx="2"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="46.0" y="926.0">驗證</tspan></text><rect id="b49" x="24.0" y="946.6" width="552.0" height="65.1" fill="#ecebe8" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#5b5b5b" text-anchor="start" font-weight="400" data-box="b49"><tspan x="42.0" y="988.0">叫同一個工作階段自己檢查</tspan></text><path d="M300.0,1013.7 L300.0,1041.7" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b50" x="24.0" y="1045.7" width="552.0" height="65.1" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b50"><tspan x="42.0" y="1087.1">另開工作階段挑錯，優先找外部證據</tspan></text><rect x="24.0" y="1148.8" width="10.0" height="28.0" fill="#1a1a1a" stroke="none" stroke-width="1.5" rx="2"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="46.0" y="1170.2">人的位置</tspan></text><rect id="b51" x="24.0" y="1190.8" width="552.0" height="65.1" fill="#ecebe8" stroke="#d9d6d0" stroke-width="2" rx="12"/><text font-size="26" fill="#5b5b5b" text-anchor="start" font-weight="400" data-box="b51"><tspan x="42.0" y="1232.2">一筆筆搬工單的輸送帶</tspan></text><path d="M300.0,1258.0 L300.0,1286.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><rect id="b52" x="24.0" y="1290.0" width="552.0" height="65.1" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" data-box="b52"><tspan x="42.0" y="1331.4">定目標、驗收結果</tspan></text><text font-size="24" fill="#5b5b5b" text-anchor="start" font-weight="400"><tspan x="24.0" y="1412.7">右欄是 Felix 的個人做法；官方文件對角色設定與</tspan><tspan x="24.0" y="1445.8">自我驗證另有不同寫法，見內文。</tspan></text></svg>