<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 981" width="600" height="981" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">對抗式審查流程</title><desc id="d">流程圖：做事的 Claude 工作階段產出初稿後，另開新的工作階段分出三個攻擊者（代表），分別證明事實有誤、思考方向不對、誤解了某些東西；批評送到裁判（judge）判斷哪些成立；成立的回饋回到原作者 A，由它自己決定要不要採納，不成立的批評丟棄。附註：Felix 說看任務而定，攻擊者通常可以用低一階的模型；他說「另外分出十個」，示範時開了五條。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="600" height="981" fill="#f9f7f4"/><rect id="b8" x="40.0" y="30.0" width="520.0" height="65.1" fill="#e3ecfb" stroke="#2f6fdb" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b8"><tspan x="300.0" y="71.4">做事的 Claude 工作階段：產出初稿</tspan></text><text font-size="24" fill="#5b5b5b" text-anchor="start" font-weight="700"><tspan x="86.0" y="132.7">另開新的工作階段</tspan></text><rect id="b9" x="116.0" y="165.1" width="444.0" height="65.1" fill="#fbe4e1" stroke="#d9483b" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b9"><tspan x="338.0" y="206.5">攻擊者 1：證明事實有誤</tspan></text><rect id="b10" x="116.0" y="252.2" width="444.0" height="65.1" fill="#fbe4e1" stroke="#d9483b" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b10"><tspan x="338.0" y="293.6">攻擊者 2：證明思考方向不對</tspan></text><rect id="b11" x="116.0" y="339.4" width="444.0" height="65.1" fill="#fbe4e1" stroke="#d9483b" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b11"><tspan x="338.0" y="380.8">攻擊者 3：證明誤解了某些東西</tspan></text><path d="M70.0,95.1 L70.0,371.9" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M70.0,197.7 L112.0,197.7" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M70.0,284.8 L112.0,284.8" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M70.0,371.9 L112.0,371.9" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M560.0,197.7 L580.0,197.7" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M560.0,284.8 L580.0,284.8" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M560.0,371.9 L580.0,371.9" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M580.0,197.7 L580.0,456.5 L300.0,456.5" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M300.0,456.5 L300.0,512.5" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-size="24" fill="#5b5b5b" text-anchor="start" font-weight="700"><tspan x="316.0" y="488.1">批評</tspan></text><rect id="b12" x="70.0" y="516.5" width="460.0" height="65.1" fill="#fdf1e1" stroke="#c9892b" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b12"><tspan x="300.0" y="557.9">裁判（judge）：判斷哪些批評成立</tspan></text><path d="M300.0,581.6 L300.0,611.6" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M160.0,611.6 L440.0,611.6" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round"/><path d="M160.0,611.6 L160.0,677.6" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M440.0,611.6 L440.0,677.6" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arr)"/><text font-size="24" fill="#2e8b6a" text-anchor="start" font-weight="700"><tspan x="174.0" y="647.2">成立的回饋</tspan></text><text font-size="24" fill="#5b5b5b" text-anchor="start" font-weight="700"><tspan x="454.0" y="647.2">不成立</tspan></text><rect id="b13" x="30.0" y="681.6" width="260.0" height="101.0" fill="#dff1e8" stroke="#2e8b6a" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="400" data-box="b13"><tspan x="160.0" y="723.0">回到 A：</tspan><tspan x="160.0" y="758.9">自己決定要不要採納</tspan></text><rect id="b14" x="310.0" y="681.6" width="260.0" height="101.0" fill="#ffffff" stroke="#5b5b5b" stroke-width="2" rx="12" stroke-dasharray="8 6"/><text font-size="26" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b14"><tspan x="440.0" y="723.0">不成立的批評：</tspan><tspan x="440.0" y="758.9">丟棄</tspan></text><text font-size="24" fill="#5b5b5b" text-anchor="start" font-weight="400"><tspan x="30.0" y="838.2">Felix 說看任務而定，攻擊者通常可以用低一</tspan><tspan x="30.0" y="871.3">階的模型</tspan></text><text font-size="24" fill="#5b5b5b" text-anchor="start" font-weight="400"><tspan x="30.0" y="912.2">攻擊者數量：他說『另外分出十個』，</tspan><tspan x="30.0" y="945.3">示範時開了五條</tspan></text></svg>