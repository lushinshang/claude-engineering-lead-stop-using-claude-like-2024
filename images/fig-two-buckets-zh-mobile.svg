<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 683" width="600" height="683" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">兩個桶子：要不要上重型審查</title><desc id="d">決策樹：先問「你知道好的成果長什麼樣嗎？」。不知道：多丟 AI 進去，用對抗式審查、裁判、更多 token；例如請 Claude 扮演研究員去「發現星星」，自己卻一竅不通。知道：像客戶一樣驗收成果，不必管過程；例如 Felix 不會用 Blender，但看得出網站好不好看。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5b5b"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ecebe8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49c" stroke-width="4"/></pattern></defs><rect width="600" height="683" fill="#f9f7f4"/><path id="b20" d="M300,25 L560,130 L300,235 L40,130 Z" fill="#ece6f5" stroke="#7b5ea7" stroke-width="2"/><text font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b20"><tspan x="300.0" y="120.2">你知道好的成果</tspan><tspan x="300.0" y="158.8">長什麼樣嗎？</tspan></text><path d="M300.0,235.0 L156.0,326.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M300.0,235.0 L444.0,326.0" fill="none" stroke="#5b5b5b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-size="26" fill="#c9892b" text-anchor="end" font-weight="700"><tspan x="196.0" y="275.4">不知道</tspan></text><text font-size="26" fill="#2e8b6a" text-anchor="start" font-weight="700"><tspan x="404.0" y="275.4">知道</tspan></text><rect id="b21" x="16.0" y="330.0" width="280.0" height="128.9" fill="#fdf1e1" stroke="#c9892b" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b21"><tspan x="156.0" y="367.4">多丟 AI 進去：</tspan><tspan x="156.0" y="403.3">對抗式審查、裁判、</tspan><tspan x="156.0" y="439.2">更多 token</tspan></text><rect id="b22" x="304.0" y="330.0" width="280.0" height="128.9" fill="#dff1e8" stroke="#2e8b6a" stroke-width="2" rx="12"/><text font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700" data-box="b22"><tspan x="444.0" y="367.4">像客戶一樣</tspan><tspan x="444.0" y="403.3">驗收成果，</tspan><tspan x="444.0" y="439.2">不必管過程</tspan></text><path d="M156.0,458.9 L156.0,498.9" fill="none" stroke="#d9d6d0" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M444.0,458.9 L444.0,498.9" fill="none" stroke="#d9d6d0" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 5"/><rect id="b23" x="16.0" y="498.9" width="280.0" height="154.2" fill="#ffffff" stroke="#d9d6d0" stroke-width="2" rx="12" stroke-dasharray="6 5"/><text font-size="24" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b23"><tspan x="156.0" y="534.5">例：請 Claude </tspan><tspan x="156.0" y="567.6">扮演研究員去</tspan><tspan x="156.0" y="600.7">『發現星星』，</tspan><tspan x="156.0" y="633.8">自己卻一竅不通</tspan></text><rect id="b24" x="304.0" y="498.9" width="280.0" height="154.2" fill="#ffffff" stroke="#d9d6d0" stroke-width="2" rx="12" stroke-dasharray="6 5"/><text font-size="24" fill="#5b5b5b" text-anchor="middle" font-weight="400" data-box="b24"><tspan x="444.0" y="551.0">例：Felix 不會用 </tspan><tspan x="444.0" y="584.2">Blender，</tspan><tspan x="444.0" y="617.3">但看得出網站好不好看</tspan></text></svg>